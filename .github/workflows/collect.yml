name: Collect Taiwan engineering jobs
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taiwanjobs-daily
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --filter @job/collector --filter @job/domain
      - name: Update public job observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure this project's DATABASE_URL in repository Actions secrets before syncing."
            exit 1
          fi
          bun run migrate
          bun run collect
