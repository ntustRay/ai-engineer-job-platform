name: Collect Taiwan engineering jobs
on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taiwanjobs-daily
  cancel-in-progress: false
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.connection.outputs.enabled }}
    steps:
      - name: Check for project database
        id: connection
        env:
          HAS_DATABASE: ${{ secrets.DATABASE_URL != '' }}
        run: |
          echo "enabled=$HAS_DATABASE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DATABASE" != true ]; then
            echo 'Skipped: this repository has no project DATABASE_URL secret.' >> "$GITHUB_STEP_SUMMARY"
          fi
  sync:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --filter @job/collector --filter @job/domain
      - name: Update public job observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bun run migrate
          bun run collect
